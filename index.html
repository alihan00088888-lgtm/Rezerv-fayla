<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUSRA</title>
<meta name="theme-color" content="#111827">
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
window.__firebase = {initializeApp,getFirestore,doc,getDoc,setDoc,onSnapshot};
</script>
<style>
:root{--brand:#111827;--surface:#fff;--bg:#f5f7fb;--line:#e5e7eb;--muted:#6b7280;--good:#15803d;--bad:#dc2626;--warn:#b45309}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:#111827;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.app{min-height:100vh}.sidebar{width:272px;background:#111827;color:#fff;position:fixed;inset:0 auto 0 0;z-index:50;transition:.22s;width:272px}.sidebar.collapsed{width:76px}.sidebar.collapsed .label,.sidebar.collapsed .group-title,.sidebar.collapsed .brand-text{display:none}.sidebar.collapsed .nav-btn{justify-content:center}.sidebar.collapsed .brand{justify-content:center}
.main{margin-left:272px;min-height:100vh;transition:.22s}.main.expanded{margin-left:76px}
.topbar{height:72px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(17,24,39,.04)}
.nav-btn{width:100%;border:0;background:transparent;color:#d1d5db;padding:11px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.nav-btn:hover{background:#1f2937;color:#fff}.nav-btn.active{background:#fff;color:#111827;font-weight:700}.group-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;padding:18px 14px 7px}.brand{height:72px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #1f2937}.logo{width:38px;height:38px;border-radius:12px;background:#fff;color:#111827;display:grid;place-items:center;font-weight:900}
.kpi{padding:20px}.kpi .value{font-size:28px;font-weight:800;letter-spacing:-.03em}.muted{color:var(--muted)}.status{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;display:inline-flex}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.neutral{background:#f3f4f6;color:#4b5563}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.table th{font-size:12px;color:#6b7280;font-weight:700;background:#fafafa}.table tr:hover td{background:#fafafa}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:45;display:none}.overlay.show{display:block}.drawer{position:fixed;top:0;bottom:0;left:0;width:300px;background:#111827;z-index:60;transform:translateX(-100%);transition:.22s}.drawer.show{transform:translateX(0)}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#4b5563}.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:11px;padding:10px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.btn-dark{background:#111827;color:#fff}.btn-light{background:#f3f4f6;color:#111827}.btn-danger{background:#fee2e2;color:#991b1b}.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:11px;display:grid;place-items:center;cursor:pointer}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#111827;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);display:none}.toast.show{display:block}
.mobile-only{display:none}.quick{position:fixed;right:22px;bottom:22px;z-index:40}.quick button{width:54px;height:54px;border:0;border-radius:50%;background:#111827;color:#fff;font-size:26px;box-shadow:0 12px 30px rgba(17,24,39,.25);cursor:pointer}
.chart{height:230px;display:flex;align-items:flex-end;gap:10px;padding:20px}.bar{flex:1;min-width:20px;background:#111827;border-radius:8px 8px 3px 3px;position:relative}.bar span{position:absolute;top:-22px;font-size:10px;width:100%;text-align:center;color:#6b7280}.bar small{position:absolute;bottom:-20px;width:100%;text-align:center;color:#6b7280;font-size:10px}
.search{width:min(480px,42vw)}.section{padding:28px}.empty{padding:45px;text-align:center;color:#6b7280}
@media(max-width:900px){.sidebar{display:none}.main,.main.expanded{margin-left:0}.mobile-only{display:grid}.topbar{height:64px}.section{padding:18px}.search{width:100%;max-width:none}.desktop-search{display:none}.kpi .value{font-size:23px}}
@media(min-width:901px){.overlay.mobile-overlay{display:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar" class="sidebar">
  <div class="brand"><div class="logo">Y</div><div class="brand-text"><b style="font-size:19px">YUSRA</b><div style="font-size:11px;color:#9ca3af">Система учета</div></div></div>
  <div style="padding:10px">
    <button class="nav-btn active" data-page="home"><span>⌂</span><span class="label">Главная</span></button>
    <div class="group-title">Работа</div>
    <button class="nav-btn" data-page="clients"><span>♙</span><span class="label">Клиенты</span></button>
    <button class="nav-btn" data-page="contracts"><span>▣</span><span class="label">Договоры</span></button>
    <button class="nav-btn" data-page="payments"><span>✓</span><span class="label">Платежи</span></button>
    <div class="group-title">Финансы</div>
    <button class="nav-btn" data-page="finance"><span>₽</span><span class="label">Финансы</span></button>
    <button class="nav-btn" data-page="movement"><span>↕</span><span class="label">Движение денег</span></button>
    <div class="group-title">Аналитика</div>
    <button class="nav-btn" data-page="partners"><span>⌂</span><span class="label">Партнеры</span></button>
    <button class="nav-btn" data-page="investors"><span>◉</span><span class="label">Инвесторы</span></button>
    <button class="nav-btn" data-page="reports"><span>▤</span><span class="label">Отчеты</span></button>
    <div class="group-title">Система</div>
    <button class="nav-btn" data-page="settings"><span>⚙</span><span class="label">Настройки</span></button>
  </div>
</aside>
<div id="mobileDrawer" class="drawer"></div>
<div id="overlay" class="overlay"></div>

<main id="main" class="main">
<header class="topbar flex items-center gap-3 px-4 md:px-6">
  <button id="menuBtn" class="iconbtn" title="Меню">☰</button>
  <div class="desktop-search search"><input id="globalSearch" class="w-full border rounded-xl px-4 py-2.5" placeholder="Поиск клиента, телефона, договора…"></div>
  <div class="ml-auto flex items-center gap-2">
    <span id="sync" class="hidden md:inline text-xs text-gray-500">● Локально</span>
    <button id="exportBtn" class="iconbtn" title="Экспорт">⇩</button>
    <button id="importBtn" class="iconbtn" title="Импорт">⇧</button>
    <input id="fileInput" type="file" accept=".json" hidden>
    <button id="notifBtn" class="iconbtn" title="Уведомления">🔔</button>
  </div>
</header>
<div id="content"></div>
</main>
<div class="quick"><button id="quickBtn">+</button></div>
<div id="toast" class="toast"></div>

<div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
</div>

<script>
const KEY='yusra_v3_db';
const DEFAULT={contracts:[],accounting:[],taken:[],incomeExpenses:[],accounts:[],investors:[],monthlyReports:[],updatedAt:null};
let db=load(); let currentPage='home'; let searchTerm=''; let firebaseReady=false;

function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...DEFAULT}}}
function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db)); render(); scheduleCloudSave();}
function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function allPayments(c){return Array.isArray(c.installments)?c.installments:[]}
function paid(c){return allPayments(c).reduce((a,p)=>a+(Number(p.amount)||0),0)}
function remaining(c){return Math.max(0,(Number(c.totalCost)||0)-(Number(c.downPayment)||0)-paid(c))}
function status(c){if(remaining(c)<=0)return ['Закрыт','good'];const overdue=allPayments(c).some(p=>p.status==='overdue'||(p.date&&p.date<new Date().toISOString().slice(0,10)&&!p.paid));return overdue?['Просрочка','bad']:['Активен','warn']}
function contracts(){return db.contracts||[]}
function totals(){const cs=contracts();const total=cs.reduce((a,c)=>a+(Number(c.totalCost)||0),0);const debt=cs.reduce((a,c)=>a+remaining(c),0);const profit=cs.reduce((a,c)=>a+(Number(c.totalCost)||0)-(Number(c.costPrice)||0),0);const active=cs.filter(c=>remaining(c)>0).length;const overdue=cs.filter(c=>status(c)[0]==='Просрочка').length;return{total,debt,profit,active,overdue}}
function clientGroups(){const m={};contracts().forEach(c=>{const k=(c.clientName||c.name||'Без имени').trim();(m[k]??=[]).push(c)});return Object.entries(m).map(([name,cs])=>({name,cs,debt:cs.reduce((a,c)=>a+remaining(c),0),contracts:cs.length,phone:cs[0]?.phone||'',overdue:cs.filter(c=>status(c)[0]==='Просрочка').length})).sort((a,b)=>b.debt-a.debt)}
function pageTitle(){return ({home:'Главная',clients:'Клиенты',contracts:'Договоры',payments:'Платежи',finance:'Финансы',movement:'Движение денег',partners:'Партнеры',investors:'Инвесторы',reports:'Отчеты',settings:'Настройки'})[currentPage]}
function nav(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function render(){nav(); const c=document.getElementById('content');c.innerHTML=pages[currentPage](); wirePage();}

const shell=(title,sub,actions='')=>`<section class="section"><div class="flex items-start justify-between gap-4 mb-6"><div><h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">${title}</h1><p class="muted mt-1">${sub}</p></div><div class="flex gap-2">${actions}</div></div>`;
function kpi(title,value,sub,icon){return `<div class="card kpi"><div class="flex justify-between"><span class="muted text-sm font-semibold">${title}</span><span>${icon}</span></div><div class="value mt-2">${value}</div><div class="muted text-xs mt-1">${sub}</div></div>`}
function home(){const t=totals(), today=new Date().toISOString().slice(0,10);const due=contracts().flatMap(c=>allPayments(c).map(p=>({...p,c}))).filter(x=>x.date===today&&!x.paid);const recent=contracts().slice(-6).reverse();return shell('Главная','Главное за секунды: деньги, платежи и проблемные договоры.','<button class="btn btn-dark" onclick="openContract()">+ Новый договор</button>')+
`<div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">${kpi('Касса',money(cash())+' ₽','расчет по операциям','₽')}${kpi('Задолженность',money(t.debt)+' ₽','осталось получить','◔')}${kpi('Прибыль',money(t.profit)+' ₽','по договорам','↗')}${kpi('Активные',t.active,'договора','▣')}${kpi('Просрочка',t.overdue,'клиентов с проблемой','!')}</div>
<div class="grid lg:grid-cols-3 gap-5"><div class="card lg:col-span-2"><div class="p-5 flex justify-between"><div><b>Платежи сегодня</b><div class="muted text-sm">${due.length?due.length+' платежей требуют внимания':'Сегодня просроченных задач нет'}</div></div><button class="btn btn-light" onclick="go('payments')">Все платежи</button></div>${due.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Клиент</th><th>Сумма</th><th>Договор</th><th></th></tr></thead><tbody>'+due.slice(0,8).map(x=>`<tr><td><b>${esc(x.c.clientName||x.c.name)}</b><div class="text-xs muted">${esc(x.c.phone||'')}</div></td><td>${money(x.amount)} ₽</td><td>${esc(x.c.number||x.c.id||'—')}</td><td><button class="btn btn-dark" onclick='openPayment(${JSON.stringify(x.c.id||"")})'>Принять</button></td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Нет платежей на сегодня.</div>'}</div>
<div class="card"><div class="p-5"><b>Быстрые действия</b><div class="grid gap-2 mt-4"><button class="btn btn-light text-left" onclick="openContract()">＋ Создать договор</button><button class="btn btn-light text-left" onclick="openPayment()">✓ Принять платеж</button><button class="btn btn-light text-left" onclick="openOperation('expense')">− Добавить расход</button><button class="btn btn-light text-left" onclick="openOperation('movement')">↕ Движение денег</button></div></div></div></div>
<div class="grid lg:grid-cols-2 gap-5 mt-5"><div class="card"><div class="p-5"><b>Динамика платежей</b><div class="muted text-sm">Последние 6 месяцев</div></div>${chart()}</div><div class="card"><div class="p-5 flex justify-between"><div><b>Последние договоры</b><div class="muted text-sm">Быстрый доступ</div></div><button class="btn btn-light" onclick="go('contracts')">Все</button></div>${recent.length?'<div class="table-wrap"><table class="table"><tbody>'+recent.map(c=>`<tr><td><b>${esc(c.clientName||c.name||'—')}</b><div class="text-xs muted">${esc(c.product||'')}</div></td><td>${money(remaining(c))} ₽</td><td><span class="status ${status(c)[1]}">${status(c)[0]}</span></td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Пока нет договоров.</div>'}</div></div></section>`}
function chart(){const vals=Array.from({length:6},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);const ym=d.toISOString().slice(0,7);return {m:ym.slice(5),v:db.accounting.filter(x=>x.type==='income'&&String(x.date||'').startsWith(ym)).reduce((a,x)=>a+Number(x.amount||0),0)}});const max=Math.max(1,...vals.map(x=>x.v));return `<div class="chart">${vals.map(x=>`<div class="bar" style="height:${Math.max(8,x.v/max*170)}px"><span>${money(x.v)}</span><small>${x.m}</small></div>`).join('')}</div>`}
function clients(){let rows=clientGroups();if(searchTerm)rows=rows.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(searchTerm));return shell('Клиенты','Один клиент — все его договоры, долг и история.','<button class="btn btn-dark" onclick="openContract()">+ Новый договор</button>')+
`<div class="card"><div class="p-4 flex gap-3"><input id="clientSearch" class="border rounded-xl px-4 py-2 w-full" placeholder="Поиск клиента или телефона" value="${esc(searchTerm)}"><button class="btn btn-light" onclick="document.getElementById('clientSearch').value='';searchTerm='';render()">Сбросить</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Клиент</th><th>Телефон</th><th>Договоры</th><th>Долг</th><th>Статус</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${x.contracts}</td><td><b>${money(x.debt)} ₽</b></td><td>${x.overdue?'<span class="status bad">Просрочка</span>':'<span class="status good">Норма</span>'}</td><td><button class="btn btn-light" onclick='clientDetail(${JSON.stringify(x.name)})'>Открыть</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">Клиенты не найдены.</div></td></tr>`}</tbody></table></div></div></section>`}
function contractsPage(){let cs=contracts();if(searchTerm)cs=cs.filter(c=>(JSON.stringify(c)).toLowerCase().includes(searchTerm));return shell('Договоры','Активные, закрытые и просроченные договоры в одной таблице.','<button class="btn btn-dark" onclick="openContract()">+ Новый договор</button>')+
`<div class="card"><div class="p-4 flex flex-wrap gap-2"><button class="btn btn-light" onclick="searchTerm='';render()">Все</button><button class="btn btn-light" onclick="filterContracts('active')">Активные</button><button class="btn btn-light" onclick="filterContracts('overdue')">Просрочка</button><button class="btn btn-light" onclick="filterContracts('closed')">Закрытые</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Договор</th><th>Клиент</th><th>Товар</th><th>Остаток</th><th>Следующий платеж</th><th>Статус</th><th></th></tr></thead><tbody>${cs.length?cs.map(c=>`<tr><td><b>${esc(c.number||c.id||'—')}</b></td><td>${esc(c.clientName||c.name||'—')}<div class="text-xs muted">${esc(c.phone||'')}</div></td><td>${esc(c.product||'—')}</td><td><b>${money(remaining(c))} ₽</b></td><td>${esc(nextPayment(c)||'—')}</td><td><span class="status ${status(c)[1]}">${status(c)[0]}</span></td><td><button class="btn btn-light" onclick='contractDetail(${JSON.stringify(c.id||c.number)})'>Открыть</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">Договоров нет.</div></td></tr>`}</tbody></table></div></div></section>`}
function filterContracts(kind){let cs=contracts().filter(c=>kind==='closed'?remaining(c)<=0:kind==='overdue'?status(c)[0]==='Просрочка':remaining(c)>0);document.getElementById('content').innerHTML=shell('Договоры',kind==='closed'?'Закрытые':kind==='overdue'?'Просрочка':'Активные','')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Клиент</th><th>Договор</th><th>Остаток</th><th>Статус</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.clientName||c.name)}</td><td>${esc(c.number||c.id||'')}</td><td>${money(remaining(c))} ₽</td><td><span class="status ${status(c)[1]}">${status(c)[0]}</span></td><td><button class="btn btn-light" onclick='contractDetail(${JSON.stringify(c.id||c.number)})'>Открыть</button></td></tr>`).join('')}</tbody></table></div></div></section>`}
function payments(){const today=new Date().toISOString().slice(0,10);const ps=contracts().flatMap(c=>allPayments(c).map((p,i)=>({...p,c,i}))).filter(x=>!x.paid).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));return shell('Платежи','Сегодня, ближайшие платежи и просрочка.','<button class="btn btn-dark" onclick="openPayment()">+ Принять платеж</button>')+
`<div class="grid md:grid-cols-3 gap-4 mb-5">${kpi('Сегодня',ps.filter(x=>x.date===today).length,'платежей','✓')}${kpi('Просрочено',ps.filter(x=>x.date&&x.date<today).length,'требуют внимания','!')}${kpi('Ближайшие',ps.filter(x=>x.date&&x.date>today).length,'будущих платежей','→')}</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Клиент</th><th>Договор</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody>${ps.slice(0,100).map(x=>{const st=x.date<today?'Просрочка':x.date===today?'Сегодня':'Предстоящий';return `<tr><td>${esc(x.date||'—')}</td><td>${esc(x.c.clientName||x.c.name||'')}</td><td>${esc(x.c.number||x.c.id||'')}</td><td><b>${money(x.amount)} ₽</b></td><td><span class="status ${st==='Просрочка'?'bad':st==='Сегодня'?'warn':'neutral'}">${st}</span></td><td><button class="btn btn-dark" onclick='openPayment(${JSON.stringify(x.c.id||"")},${x.i})'>Принять</button></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">Нет открытых платежей.</div></td></tr>'}</tbody></table></div></div></section>`}
function finance(){const income=(db.accounting||[]).filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0),expense=(db.accounting||[]).filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0);return shell('Финансы','Доходы, расходы и контроль денежных потоков.','<button class="btn btn-dark" onclick="openOperation(\'income\')">+ Операция</button>')+

`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Описание</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.type||'Движение')}</td><td><b>${money(x.amount)} ₽</b></td><td>${esc(x.description||'')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Движений пока нет.</div></td></tr>'}</tbody></table></div></div></section>`}

`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${Object.entries(m).map(([n,x])=>`<div class="card p-5"><div class="flex justify-between"><b>${esc(n)}</b><span class="status neutral">${x.count} договоров</span></div><div class="mt-5 grid grid-cols-2 gap-3"><div><div class="muted text-xs">Продажи</div><b>${money(x.sales)} ₽</b></div><div><div class="muted text-xs">Прибыль</div><b>${money(x.profit)} ₽</b></div></div></div>`).join('')||'<div class="card empty">Партнеров пока нет.</div>'}</div></section>`}

`<div class="grid md:grid-cols-3 gap-4 mb-5">${kpi('Капитал',money(rows.reduce((a,x)=>a+Number(x.capital||x.capitalStart||0),0))+' ₽','в системе','◉')}${kpi('Инвесторов',rows.length,'участников','♙')}${kpi('Отчетов',db.monthlyReports?.length||0,'месячных отчетов','▤')}</div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${rows.map(x=>`<div class="card p-5"><b>${esc(x.name||'Инвестор')}</b><div class="muted text-sm mt-1">${esc(x.phone||'')}</div><div class="mt-5 text-2xl font-extrabold">${money(x.capital||x.capitalStart||0)} ₽</div><div class="muted text-xs mt-1">капитал</div></div>`).join('')||'<div class="card empty">Добавьте первого инвестора.</div>'}</div></section>`}
function reports(){const t=totals();return shell('Отчеты','Сводка для управления бизнесом.','<button class="btn btn-light" onclick="window.print()">Печать</button>')+
`<div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">${kpi('Оборот',money(t.total)+' ₽','по договорам','Σ')}${kpi('Себестоимость',money(contracts().reduce((a,c)=>a+Number(c.costPrice||0),0))+' ₽','по договорам','↘')}${kpi('Прибыль',money(t.profit)+' ₽','продажа − себестоимость','↗')}${kpi('Долг',money(t.debt)+' ₽','остаток клиентов','◔')}</div><div class="card p-6 mt-5"><h3 class="font-bold">Контроль</h3><div class="grid md:grid-cols-2 gap-3 mt-4">${['Проверьте просроченные платежи','Сверьте кассу с фактическими деньгами','Закройте текущий месяц после проверки','Сделайте экспорт резервной копии'].map((x,i)=>`<div class="p-4 bg-gray-50 rounded-xl flex gap-3"><span>${i+1}</span><span>${x}</span></div>`).join('')}</div></div></section>`}

`<div class="grid lg:grid-cols-2 gap-5"><div class="card p-6"><h3 class="font-bold text-lg">Интерфейс</h3><div class="flex items-center justify-between mt-5"><div><b>Боковое меню</b><div class="muted text-sm">Состояние сохраняется на этом устройстве</div></div><button class="btn btn-light" onclick="toggleSidebar()">Свернуть / развернуть</button></div><div class="flex items-center justify-between mt-5"><div><b>Темная тема</b><div class="muted text-sm">Экспериментальный режим</div></div><button class="btn btn-light" onclick="toggleDark()">Переключить</button></div></div>
<div class="card p-6"><h3 class="font-bold text-lg">Данные</h3><p class="muted text-sm mt-2">Firebase-синхронизация сохранена. Перед крупными изменениями рекомендуется сделать JSON-экспорт.</p><div class="flex gap-2 mt-5"><button class="btn btn-dark" onclick="exportData()">Скачать резервную копию</button><button class="btn btn-light" onclick="document.getElementById('fileInput').click()">Восстановить JSON</button></div><div class="mt-5 p-4 rounded-xl bg-gray-50 text-sm"><b>Название системы:</b> YUSRA<br><b>Синхронизация:</b> <span id="settingsSync">проверяется…</span></div></div></div></section>`}

function nextPayment(c){return allPayments(c).filter(p=>!p.paid&&p.date).sort((a,b)=>a.date.localeCompare(b.date))[0]?.date}
function cash(){let x=contracts().reduce((a,c)=>a+(Number(c.downPayment)||0)+paid(c)-(Number(c.costPrice)||0),0);x-=db.taken.reduce((a,r)=>a+(r.type==='taken'?Number(r.amount||0):0),0);x+=db.taken.reduce((a,r)=>a+(r.type==='put'?Number(r.amount||0):0),0);x+=db.accounting.reduce((a,r)=>a+(r.type==='income'?Number(r.amount||0):-Number(r.amount||0)),0);return x}

function openContract(){
document.getElementById('modal').innerHTML=`<div class="p-6 border-b flex justify-between"><div><h2 class="text-xl font-extrabold">Новый договор</h2><p class="muted text-sm">Заполните клиента и финансовые условия.</p></div><button class="iconbtn" onclick="closeModal()">×</button></div>
<form id="contractForm" class="p-6 grid md:grid-cols-2 gap-4">
<div class="field"><label>ФИО клиента</label><input name="clientName" required></div><div class="field"><label>Телефон</label><input name="phone"></div>
<div class="field"><label>Товар</label><input name="product"></div><div class="field"><label>Магазин / партнер</label><input name="store"></div>
<div class="field"><label>Стоимость продажи</label><input name="totalCost" type="number" required></div><div class="field"><label>Себестоимость</label><input name="costPrice" type="number" value="0"></div>
<div class="field"><label>Первоначальный взнос</label><input name="downPayment" type="number" value="0"></div><div class="field"><label>Количество месяцев</label><input name="months" type="number" value="12"></div>
<div class="field"><label>Дата покупки</label><input name="purchaseDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Первый платеж</label><input name="firstPayment" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="md:col-span-2 p-4 bg-gray-50 rounded-xl text-sm" id="calcBox">Введите сумму и срок — здесь появится расчет.</div>
<div class="md:col-span-2 flex justify-end gap-2"><button type="button" class="btn btn-light" onclick="closeModal()">Отмена</button><button class="btn btn-dark">Создать договор</button></div></form>`;
document.getElementById('modalBack').classList.add('show');
const f=document.getElementById('contractForm');f.addEventListener('input',calcContract);f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const total=+d.totalCost||0,down=+d.downPayment||0,months=Math.max(1,+d.months||1),monthly=(total-down)/months;if(total<=0||down>total)return toast('Проверьте суммы');const id='C-'+Date.now();db.contracts.push({id,number:id,...d,totalCost:total,costPrice:+d.costPrice||0,downPayment:down,months,monthlyPayment:monthly,installments:Array.from({length:months},(_,i)=>{const dt=new Date(d.firstPayment);dt.setMonth(dt.getMonth()+i);return {date:dt.toISOString().slice(0,10),amount:monthly,paid:false}})});save();closeModal();toast('Договор создан');};calcContract();
}
function calcContract(){const f=document.getElementById('contractForm');if(!f)return;const total=+f.totalCost.value||0,down=+f.downPayment.value||0,m=+f.months.value||1,rem=Math.max(0,total-down),monthly=rem/m;document.getElementById('calcBox').innerHTML=`<b>Расчет:</b> остаток ${money(rem)} ₽ · ежемесячно ${money(monthly)} ₽ · переплата ${money(total-down)} ₽`}
function openPayment(id,idx){let c=id?contracts().find(x=>x.id===id):null;if(!c){const opts=contracts().filter(x=>remaining(x)>0);if(!opts.length)return toast('Нет активных договоров');c=opts[0];idx=0}if(idx==null)idx=allPayments(c).findIndex(p=>!p.paid);if(idx<0)idx=0;const p=allPayments(c)[idx]||{amount:remaining(c),date:new Date().toISOString().slice(0,10)};document.getElementById('modal').innerHTML=`<div class="p-6 border-b flex justify-between"><div><h2 class="text-xl font-extrabold">Принять платеж</h2><p class="muted text-sm">${esc(c.clientName||c.name)} · ${esc(c.number||c.id||'')}</p></div><button class="iconbtn" onclick="closeModal()">×</button></div><form id="payForm" class="p-6 grid gap-4"><div class="field"><label>Сумма</label><input name="amount" type="number" value="${p.amount||remaining(c)}" required></div><div class="field"><label>Дата</label><input name="date" type="date" value="${p.date||new Date().toISOString().slice(0,10)}"></div><div class="flex justify-end gap-2"><button type="button" class="btn btn-light" onclick="closeModal()">Отмена</button><button class="btn btn-dark">Провести платеж</button></div></form>`;document.getElementById('modalBack').classList.add('show');document.getElementById('payForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!c.installments)c.installments=[];c.installments[idx]={...p,amount:+d.amount,date:d.date,paid:true,paidAt:new Date().toISOString()};save();closeModal();toast('Платеж принят')}}
function openOperation(type='income'){document.getElementById('modal').innerHTML=`<div class="p-6 border-b flex justify-between"><h2 class="text-xl font-extrabold">${type==='movement'?'Движение денег':'Новая операция'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form id="opForm" class="p-6 grid gap-4"><div class="field"><label>Тип</label><select name="type">${type==='movement'?'<option value="taken">Выдача из кассы</option><option value="put">Возврат в кассу</option>':'<option value="income">Доход</option><option value="expense">Расход</option>'}</select></div><div class="field"><label>Сумма</label><input name="amount" type="number" required></div><div class="field"><label>Дата</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Описание</label><input name="description"></div><div class="flex justify-end gap-2"><button type="button" class="btn btn-light" onclick="closeModal()">Отмена</button><button class="btn btn-dark">Сохранить</button></div></form>`;document.getElementById('modalBack').classList.add('show');document.getElementById('opForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.type==='taken'||d.type==='put')db.taken.push({...d,amount:+d.amount});else db.accounting.push({...d,amount:+d.amount});save();closeModal();toast('Операция сохранена')}}
function openInvestor(){document.getElementById('modal').innerHTML=`<div class="p-6 border-b flex justify-between"><h2 class="text-xl font-extrabold">Новый инвестор</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form id="invForm" class="p-6 grid gap-4"><div class="field"><label>Имя</label><input name="name" required></div><div class="field"><label>Телефон</label><input name="phone"></div><div class="field"><label>Капитал</label><input name="capital" type="number" required></div><div class="flex justify-end gap-2"><button type="button" class="btn btn-light" onclick="closeModal()">Отмена</button><button class="btn btn-dark">Добавить</button></div></form>`;document.getElementById('modalBack').classList.add('show');document.getElementById('invForm').onsubmit=e=>{e.preventDefault();db.investors.push(Object.fromEntries(new FormData(e.target)));db.investors.at(-1).capital=+db.investors.at(-1).capital;save();closeModal();toast('Инвестор добавлен')}}
